<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minhaj Model School - Student Directory</title>
    <!-- Google Fonts & FontAwesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;700&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #1e3a8a;
            --primary-light: #3b82f6;
            --secondary: #0f766e;
            --accent: #f59e0b;
            --danger: #ef4444;
            --bg-light: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08);
            --radius: 12px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', 'Noto Nastaliq Urdu', sans-serif;
        }

        body {
            background: #f1f5f9;
            color: var(--text-main);
            padding-bottom: 50px;
        }

        /* Top Header Navigation */
        .top-navbar {
            background: linear-gradient(90deg, #1e1b4b, #1e3a8a);
            color: white;
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        .brand-title {
            font-size: 1.2rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-buttons {
            display: flex;
            gap: 10px;
        }

        .btn-nav {
            background: rgba(255, 255, 255, 0.15);
            color: white;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            transition: all 0.3s;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn-nav:hover {
            background: var(--accent);
            color: #000;
        }

        /* Main Container */
        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        /* Page Heading & Stats Bar */
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 25px;
            background: var(--card-bg);
            padding: 20px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }

        .page-header h2 {
            color: var(--primary);
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .stat-badge {
            background: #e0f2fe;
            color: #0369a1;
            padding: 6px 16px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 0.95rem;
        }

        /* Search & Filter Controls */
        .controls-card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            margin-bottom: 25px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .search-box {
            flex: 2;
            min-width: 250px;
            position: relative;
        }

        .search-box i {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        .search-box input {
            width: 100%;
            padding: 12px 45px 12px 15px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
            transition: 0.3s;
        }

        .search-box input:focus {
            border-color: var(--primary-light);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        .filter-box {
            flex: 1;
            min-width: 180px;
        }

        .filter-box select {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
            background: white;
            cursor: pointer;
        }

        /* Responsive Table Design */
        .table-responsive {
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: right;
            min-width: 800px;
        }

        thead {
            background: #1e293b;
            color: white;
        }

        th, td {
            padding: 14px 18px;
            border-bottom: 1px solid #e2e8f0;
            font-size: 0.95rem;
        }

        th {
            font-weight: 600;
        }

        tbody tr:hover {
            background-color: #f8fafc;
        }

        .badge-class {
            background: #fef3c7;
            color: #92400e;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: bold;
        }

        .actions-cell {
            display: flex;
            gap: 8px;
        }

        .btn-action-icon {
            border: none;
            width: 34px;
            height: 34px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
            color: white;
        }

        .btn-print {
            background: var(--secondary);
        }

        .btn-print:hover {
            background: #0d9488;
        }

        .btn-delete {
            background: var(--danger);
        }

        .btn-delete:hover {
            background: #dc2626;
        }

        /* Empty State Warning */
        .no-data {
            text-align: center;
            padding: 50px 20px;
            color: var(--text-muted);
        }

        .no-data i {
            font-size: 3rem;
            margin-bottom: 15px;
            color: #cbd5e1;
        }

        /* Print Media Styles */
        @media print {
            .top-navbar, .controls-card, .actions-cell, .btn-nav {
                display: none !important;
            }
            body {
                background: white;
                padding: 0;
            }
            .container {
                max-width: 100%;
                margin: 0;
            }
            .table-responsive {
                box-shadow: none;
            }
        }
    </style>
</head>
<body>

    <!-- Top Navigation Bar -->
    <div class="top-navbar">
        <div class="brand-title">
            <i class="fa-solid fa-graduation-cap"></i> MINHAJ MODEL SCHOOL QILA MURAD BUKHASH
        </div>
        <div class="nav-buttons">
            <a href="index.html" class="btn-nav"><i class="fa-solid fa-house"></i> ہوم پیج</a>
            <a href="admission.html" class="btn-nav"><i class="fa-solid fa-user-plus"></i> نیا داخلہ</a>
        </div>
    </div>

    <!-- Main Content Container -->
    <div class="container">

        <!-- Page Header -->
        <div class="page-header">
            <h2><i class="fa-solid fa-users"></i> طلباء کا ریکارڈ ڈائریکٹری (Student Directory)</h2>
            <div class="stat-badge">کل طلباء: <span id="total-count">0</span></div>
        </div>

        <!-- Search and Filter Bar -->
        <div class="controls-card">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" onkeyup="filterStudents()" placeholder="طالب علم کا نام، والد کا نام یا G.R/رول نمبر تلاش کریں...">
            </div>
            <div class="filter-box">
                <select id="classFilter" onchange="filterStudents()">
                    <option value="">تمام کلاسز (All Classes)</option>
                    <option value="Nursery">نرسری (Nursery)</option>
                    <option value="Prep">پریپ (Prep)</option>
                    <option value="Class 1">کلاس اول (Class 1)</option>
                    <option value="Class 2">کلاس دوم (Class 2)</option>
                    <option value="Class 3">کلاس سوم (Class 3)</option>
                    <option value="Class 4">کلاس چہارم (Class 4)</option>
                    <option value="Class 5">کلاس پنجم (Class 5)</option>
                    <option value="Class 6">کلاس ششم (Class 6)</option>
                    <option value="Class 7">کلاس ہفتم (Class 7)</option>
                    <option value="Class 8">کلاس ہشتم (Class 8)</option>
                    <option value="Class 9">کلاس نہم (Class 9)</option>
                    <option value="Class 10">کلاس دہم (Class 10)</option>
                </select>
            </div>
            <button onclick="window.print()" class="btn-nav" style="background: var(--primary); border: none; cursor: pointer;">
                <i class="fa-solid fa-print"></i> لسٹ پرنٹ کریں
            </button>
        </div>

        <!-- Student Data Table -->
        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>G.R / رول نمبر</th>
                        <th>نام طالب علم</th>
                        <th>والد کا نام</th>
                        <th>کلاس</th>
                        <th>رابطہ نمبر</th>
                        <th>ماہانہ فیس</th>
                        <th>ایکشن</th>
                    </tr>
                </thead>
                <tbody id="studentTableBody">
                    <!-- Dynamic Rows Will Load Here From Firebase -->
                </tbody>
            </table>
            
            <div id="noDataMessage" class="no-data" style="display: none;">
                <i class="fa-solid fa-folder-open"></i>
                <h3>کوئی ریکارڈ نہیں ملا</h3>
                <p>فی الحال کوئی طالب علم رجسٹرڈ نہیں ہے یا آپ کی تلاش کے مطابق ڈیٹا موجود نہیں ہے۔</p>
            </div>
        </div>

    </div>

    <!-- JavaScript Filter Function -->
    <script>
        // Live Search and Filter Function
        function filterStudents() {
            const searchVal = document.getElementById('searchInput').value.toLowerCase();
            const classVal = document.getElementById('classFilter').value;
            const rows = document.querySelectorAll('#studentTableBody tr');
            let visibleCount = 0;

            rows.forEach(row => {
                const text = row.innerText.toLowerCase();
                const classText = row.children[3]?.innerText || '';

                const matchesSearch = text.includes(searchVal);
                const matchesClass = classVal === "" || classText.includes(classVal);

                if (matchesSearch && matchesClass) {
                    row.style.display = "";
                    visibleCount++;
                } else {
                    row.style.display = "none";
                }
            });

            document.getElementById('noDataMessage').style.display = visibleCount === 0 ? 'block' : 'none';
        }

        // Print Individual Student
        function printStudentCard(grNo) {
            alert("G.R No. " + grNo + " کا فارم پرنٹ کے لیے تیار ہے۔");
            // window.location.href = `admission.html?gr_no=${grNo}`;
        }
    </script>

    <!-- Firebase Engine Scripts (ES6 Module) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyC1FaG4y0KvGR14AUtkyFv8JqjvSMi3JM0",
            authDomain: "mms-cms.firebaseapp.com",
            databaseURL: "https://mms-cms-default-rtdb.firebaseio.com",
            projectId: "mms-cms",
            storageBucket: "mms-cms.firebasestorage.app",
            messagingSenderId: "611376873606",
            appId: "1:611376873606:web:3d47d4eeeb5d0d36391107"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);

        // Fetch & Realtime Listen Students Data from Firebase
        function listenToStudentData() {
            const studentsRef = ref(database, 'students');
            const tbody = document.getElementById('studentTableBody');
            const totalCount = document.getElementById('total-count');
            const noDataMessage = document.getElementById('noDataMessage');

            onValue(studentsRef, (snapshot) => {
                tbody.innerHTML = '';
                const data = snapshot.val();

                if (!data) {
                    totalCount.textContent = '0';
                    noDataMessage.style.display = 'block';
                    return;
                }

                noDataMessage.style.display = 'none';
                const studentKeys = Object.keys(data);
                totalCount.textContent = studentKeys.length;

                studentKeys.forEach((key) => {
                    const student = data[key];
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td><strong>${student.gr_no || student.roll_no || key}</strong></td>
                        <td>${student.student_name || 'N/A'}</td>
                        <td>${student.father_name || 'N/A'}</td>
                        <td><span class="badge-class">${student.enrolled_class || 'N/A'}</span></td>
                        <td>${student.primary_phone || 'N/A'}</td>
                        <td>Rs. ${student.monthly_fee || '0'}</td>
                        <td class="actions-cell">
                            <button class="btn-action-icon btn-print" onclick="printStudentCard('${student.gr_no || key}')" title="پرنٹ فارم">
                                <i class="fa-solid fa-print"></i>
                            </button>
                            <button class="btn-action-icon btn-delete" onclick="window.deleteStudentFromFirebase('${key}')" title="ڈیلیٹ کریں">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });

                // Apply search filters if input is actively typed
                filterStudents();
            }, (error) => {
                console.error("Firebase fetch error:", error);
            });
        }

        // Delete Student directly from Firebase Database
        window.deleteStudentFromFirebase = function(grNoKey) {
            if (confirm("کیا آپ واقعی اس طالب علم کا ریکارڈ فائر بیس سے ڈیلیٹ کرنا چاہتے ہیں؟")) {
                const studentItemRef = ref(database, 'students/' + grNoKey);
                remove(studentItemRef)
                    .then(() => {
                        alert("طالب علم کا ریکارڈ کامیابی سے ڈیلیٹ کر دیا گیا ہے!");
                    })
                    .catch((error) => {
                        console.error("ڈیلیٹ کرنے میں مسئلہ:", error);
                        alert("ڈیلیٹ نہیں ہو سکا: " + error.message);
                    });
            }
        };

        // Execute on Load
        window.addEventListener('DOMContentLoaded', listenToStudentData);
    </script>

</body>
</html>
